name: Build and Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Build frontend
      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # 4️⃣ Package frontend and backend for deployment
      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r frontend/dist deploy/dist
          cp -r backend/* deploy/

      # 5️⃣ Copy files to Azure VM via SSH
      - name: Deploy to Azure VM
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          source: "deploy/*"
          target: "/home/${{ secrets.AZURE_VM_USER }}/app"

      # 6️⃣ SSH into VM and start backend + Nginx
      - name: SSH commands on Azure VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          script: |
            cd ~/app

            # Install Node dependencies
            cd backend
            npm ci

            # Start backend in background
            nohup npm start &

            # Install Nginx if not installed
            if ! command -v nginx &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            # Configure Nginx
            sudo bash -c 'cat > /etc/nginx/sites-available/default <<EOF
            server {
                listen 80;
                server_name localhost;

                root /home/${{ secrets.AZURE_VM_USER }}/app/dist;
                index index.html;

                location / {
                    try_files \$uri /index.html;
                }

                location /api/ {
                    proxy_pass http://localhost:5000/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                    proxy_set_header Host \$host;
                }
            }
            EOF'

            # Restart Nginx
            sudo systemctl restart nginx
